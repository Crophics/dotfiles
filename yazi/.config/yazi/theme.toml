# Matugen template: yazi file manager theme from wallpaper

[mode]
normal_main = { fg = "#372d3a", bg = "#d1c2d2", bold = true }
normal_alt  = { fg = "#d1c2d2", bg = "reset" }
select_main = { fg = "#352e36", bg = "#cec3cd", bold = true }
select_alt  = { fg = "#cec3cd", bg = "reset" }
unset_main  = { fg = "#392c3d", bg = "#d4c0d7", bold = true }
unset_alt   = { fg = "#d4c0d7", bg = "reset" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#d1c2d2", bold = true }
perm_read  = { fg = "#d4c0d7" }
perm_write = { fg = "#cec3cd" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#949091" }

progress_label  = { fg = "#e7e1e3", bold = true }
progress_normal = { fg = "#d1c2d2", bg = "reset" }
progress_error  = { fg = "#ffb4ab", bg = "reset" }

[mgr]
cwd = { fg = "#d1c2d2", bold = true }

find_keyword  = { fg = "#d4c0d7", bold = true, italic = true, underline = true }
find_position = { fg = "#cec3cd", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#d1c2d2", bg = "#d1c2d2" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#cec3cd", bg = "#cec3cd" }
marker_selected = { fg = "#d4c0d7", bg = "#d4c0d7" }

count_copied   = { fg = "#372d3a", bg = "#d1c2d2" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#392c3d", bg = "#d4c0d7" }

border_symbol = "│"
border_style  = { fg = "#949091" }

[indicator]
parent  = { fg = "#cec3cd", bg = "#2b292b", bold = true }
current = { fg = "#d1c2d2", bg = "#363436", bold = true }
preview = { fg = "#949091", bg = "#2b292b", bold = true }
padding = { open = "", close = " " }

[tabs]
active   = { fg = "#372d3a", bg = "#d1c2d2" }
inactive = { fg = "#e7e1e3", bg = "#211f20" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "#d1c2d2" }
title    = { fg = "#d1c2d2" }
value    = { fg = "#e7e1e3" }
selected = { reversed = true }

[pick]
border   = { fg = "#d1c2d2" }
active   = { fg = "#372d3a", bg = "#d1c2d2" }
inactive = { fg = "#e7e1e3" }

[confirm]
border = { fg = "#d1c2d2" }
title  = { fg = "#d1c2d2" }
body   = { fg = "#e7e1e3" }
list   = { fg = "#e7e1e3" }
btn_yes = { fg = "#372d3a", bg = "#d1c2d2" }
btn_no  = { fg = "#690005", bg = "#ffb4ab" }
btn_labels = [ " Yes ", " No " ]

[notify]
title_info  = { fg = "#d1c2d2" }
title_warn  = { fg = "#d4c0d7" }
title_error = { fg = "#ffb4ab" }

[help]
on     = { fg = "#d1c2d2" }
run    = { fg = "#cec3cd" }
desc   = { fg = "#e7e1e3" }
hovered = { reversed = true }
footer  = { fg = "#949091" }

[which]
cols = 3
mask = { bg = "#211f20" }
cand = { fg = "#d1c2d2" }
rest = { fg = "#949091" }
desc = { fg = "#e7e1e3" }
separator = " → "
separator_style = { fg = "#949091" }

[tasks]
border  = { fg = "#d1c2d2" }
title   = { fg = "#d1c2d2" }
hovered = { reversed = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#cec3cd" },
    { mime = "{audio,video}/*", fg = "#cec3cd" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },
    { mime = "application/{pdf,doc,rtf}", fg = "#d1c2d2" },
    { url = "*/", fg = "#cec3cd", bold = true },
    { url = "*", fg = "#d4c0d7" },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
