# Matugen template: yazi file manager theme from wallpaper

[mode]
normal_main = { fg = "#3f2c24", bg = "#dfc0b4", bold = true }
normal_alt  = { fg = "#dfc0b4", bg = "reset" }
select_main = { fg = "#3b2d28", bg = "#d8c2ba", bold = true }
select_alt  = { fg = "#d8c2ba", bg = "reset" }
unset_main  = { fg = "#442a1f", bg = "#e7beae", bold = true }
unset_alt   = { fg = "#e7beae", bg = "reset" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#dfc0b4", bold = true }
perm_read  = { fg = "#e7beae" }
perm_write = { fg = "#d8c2ba" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#968f8d" }

progress_label  = { fg = "#e9e1de", bold = true }
progress_normal = { fg = "#dfc0b4", bg = "reset" }
progress_error  = { fg = "#ffb4ab", bg = "reset" }

[mgr]
cwd = { fg = "#dfc0b4", bold = true }

find_keyword  = { fg = "#e7beae", bold = true, italic = true, underline = true }
find_position = { fg = "#d8c2ba", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#dfc0b4", bg = "#dfc0b4" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#d8c2ba", bg = "#d8c2ba" }
marker_selected = { fg = "#e7beae", bg = "#e7beae" }

count_copied   = { fg = "#3f2c24", bg = "#dfc0b4" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#442a1f", bg = "#e7beae" }

border_symbol = "│"
border_style  = { fg = "#968f8d" }

[indicator]
parent  = { fg = "#d8c2ba", bg = "#2d2928", bold = true }
current = { fg = "#dfc0b4", bg = "#383432", bold = true }
preview = { fg = "#968f8d", bg = "#2d2928", bold = true }
padding = { open = "", close = " " }

[tabs]
active   = { fg = "#3f2c24", bg = "#dfc0b4" }
inactive = { fg = "#e9e1de", bg = "#221f1e" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "#dfc0b4" }
title    = { fg = "#dfc0b4" }
value    = { fg = "#e9e1de" }
selected = { reversed = true }

[pick]
border   = { fg = "#dfc0b4" }
active   = { fg = "#3f2c24", bg = "#dfc0b4" }
inactive = { fg = "#e9e1de" }

[confirm]
border = { fg = "#dfc0b4" }
title  = { fg = "#dfc0b4" }
body   = { fg = "#e9e1de" }
list   = { fg = "#e9e1de" }
btn_yes = { fg = "#3f2c24", bg = "#dfc0b4" }
btn_no  = { fg = "#690005", bg = "#ffb4ab" }
btn_labels = [ " Yes ", " No " ]

[notify]
title_info  = { fg = "#dfc0b4" }
title_warn  = { fg = "#e7beae" }
title_error = { fg = "#ffb4ab" }

[help]
on     = { fg = "#dfc0b4" }
run    = { fg = "#d8c2ba" }
desc   = { fg = "#e9e1de" }
hovered = { reversed = true }
footer  = { fg = "#968f8d" }

[which]
cols = 3
mask = { bg = "#221f1e" }
cand = { fg = "#dfc0b4" }
rest = { fg = "#968f8d" }
desc = { fg = "#e9e1de" }
separator = " → "
separator_style = { fg = "#968f8d" }

[tasks]
border  = { fg = "#dfc0b4" }
title   = { fg = "#dfc0b4" }
hovered = { reversed = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#d8c2ba" },
    { mime = "{audio,video}/*", fg = "#d8c2ba" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },
    { mime = "application/{pdf,doc,rtf}", fg = "#dfc0b4" },
    { url = "*/", fg = "#d8c2ba", bold = true },
    { url = "*", fg = "#e7beae" },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
