[general]

[font]
size = 8

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[colors.cursor]
cursor = "#d19a66"
text = "#1e1e1e"

[colors.primary]
foreground = "#d26238"
background = "#1e1e1e"

[window]
dimensions = { columns = 120, lines = 35 }
