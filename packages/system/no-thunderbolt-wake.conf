# ThinkPad P16s: the Thunderbolt controller (0000:00:0d.0 = TXHC) raises a wake
# event right after every suspend, so s2idle ends within ~7 s (lid open or closed).
# Verified with /sys/class/wakeup/*/event_count: only 0000:00:0d.0 (+ its ACPI node) counts up.
# Install: sudo cp no-thunderbolt-wake.conf /etc/tmpfiles.d/ && sudo systemd-tmpfiles --create /etc/tmpfiles.d/no-thunderbolt-wake.conf
# Cost: plugging something into the USB-C/Thunderbolt ports no longer wakes the laptop.
w /sys/bus/pci/devices/0000:00:0d.0/power/wakeup - - - - disabled
w /sys/bus/pci/devices/0000:00:0d.2/power/wakeup - - - - disabled
w /sys/bus/pci/devices/0000:00:0d.3/power/wakeup - - - - disabled
