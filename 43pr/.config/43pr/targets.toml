# Each target: input template -> output file. Optional `reload` is an argv list
# that runs once after ALL targets were written successfully.

[kitty]
input  = "~/.config/43pr/templates/kitty.conf"
output = "~/.config/kitty/matugen.conf"
reload = ["pkill", "-USR1", "-x", "kitty"]
[rofi]
input  = "~/.config/43pr/templates/rofi-colors.rasi"
output = "~/.config/rofi/colors.rasi"
[gtk3]
input  = "~/.config/43pr/templates/gtk-colors.css"
output = "~/.config/gtk-3.0/colors.css"
[gtk4]
input  = "~/.config/43pr/templates/gtk-colors.css"
output = "~/.config/gtk-4.0/colors.css"
[quickshell]
input  = "~/.config/43pr/templates/quickshell-theme.json"
output = "~/.cache/43pr/quickshell-theme.json"

[qt6ct]
input  = "~/.config/43pr/templates/qt6ct-colors.conf"
output = "~/.config/qt6ct/colors/43pr.conf"

[btop]
input  = "~/.config/43pr/templates/btop.theme"
output = "~/.config/btop/themes/43pr.theme"
reload = ["pkill", "-USR2", "-x", "btop"]

[cava]
input  = "~/.config/43pr/templates/cava-theme"
output = "~/.config/cava/themes/43pr"
reload = ["pkill", "-USR2", "-x", "cava"]

# Neovim reads these two files (its ii_palette.lua loader and watcher), so no nvim config changes are needed.
[nvim-colors]
input  = "~/.config/43pr/templates/nvim-colors.json"
output = "~/.local/state/quickshell/user/generated/colors.json"

[nvim-terminal]
input  = "~/.config/43pr/templates/kitty.conf"
output = "~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf"

# Zen browser: accent pref (applied at next launch) and a small stylesheet imported from userChrome.css.
[zen-userjs]
input  = "~/.config/43pr/templates/zen-user.js"
output = "~/.config/zen/bscizgd2.Default (release)/user.js"

[zen-palette]
input  = "~/.config/43pr/templates/zen-palette.css"
output = "~/.config/zen/bscizgd2.Default (release)/chrome/zen-palette.css"

# VSCodium: the Material Code theme reads its colors from settings.json; the hook merges just those keys.
[vscodium]
input  = "~/.config/43pr/templates/vscodium-colors.json"
output = "~/.cache/43pr/vscodium-colors.json"
reload = ["python3", "/home/ryoku/.config/43pr/bin/vscodium-merge.py"]

[hypr]
input  = "~/.config/43pr/templates/hypr-colors.lua"
output = "~/.config/hypr/colors.lua"
reload = ["hyprctl", "reload"]
