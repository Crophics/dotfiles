# Each target: input template -> output file. Optional `reload` is an argv list
# that runs once after ALL targets were written successfully.

[kitty]
input  = "~/.config/43pr/templates/kitty.conf"
output = "~/.config/kitty/matugen.conf"
reload = ["pkill", "-USR1", "-x", "kitty"]
[rofi]
input  = "~/.config/43pr/templates/rofi-colors.rasi"
output = "~/.config/rofi/colors.rasi"
[hyprlock]
input  = "~/.config/43pr/templates/hyprlock-colors.conf"
output = "~/.config/hypr/hyprlock-colors.conf"
[gtk3]
input  = "~/.config/43pr/templates/gtk-colors.css"
output = "~/.config/gtk-3.0/colors.css"
[gtk4]
input  = "~/.config/43pr/templates/gtk-colors.css"
output = "~/.config/gtk-4.0/colors.css"
[quickshell]
input  = "~/.config/43pr/templates/quickshell-theme.json"
output = "~/.cache/43pr/quickshell-theme.json"

[qt6ct]
input  = "~/.config/43pr/templates/qt6ct-colors.conf"
output = "~/.config/qt6ct/colors/43pr.conf"

[btop]
input  = "~/.config/43pr/templates/btop.theme"
output = "~/.config/btop/themes/43pr.theme"
reload = ["pkill", "-USR2", "-x", "btop"]

[cava]
input  = "~/.config/43pr/templates/cava-theme"
output = "~/.config/cava/themes/43pr"
reload = ["pkill", "-USR2", "-x", "cava"]
