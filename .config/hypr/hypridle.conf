# hypridle: lock after 5 minutes idle, suspend after 15.
# Locks before any sleep (before_sleep_cmd) and holds the sleep until the lock is up (inhibit_sleep = 3),
# so every wake shows the lock screen. The lock screen is qylock (~/.config/qylock), not hyprlock.
general {
    lock_cmd = ~/.config/qylock/lock.sh
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({action=\"on\"})"
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = ~/.config/qylock/suspend.sh
}
