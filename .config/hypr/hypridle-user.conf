# Generated by apply-session-prefs.sh from Settings > Session. Do not edit.
general {
    lock_cmd = hyprlock
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({action=\"on\"})"
}

listener {
    timeout = 290
    on-timeout = ~/.config/hypr/scripts/dim.sh dim
    on-resume = ~/.config/hypr/scripts/dim.sh restore
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/suspend.sh
}
