# hyprlock: Catppuccin Mocha lock screen (blurred desktop, clock, date, password box)
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    color = rgb(1e1e2e)
}

label {   # time
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgb(cdd6f4)
    font_size = 88
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {   # date
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgb(a6adc8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    rounding = 8
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)
    placeholder_text = <span foreground="##7f849c">password</span>
    fail_text = wrong password
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
