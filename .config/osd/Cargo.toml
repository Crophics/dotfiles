[package]
name = "osd"
version = "0.1.0"
edition = "2021"
description = "Tiny volume/brightness popup for Wayland (wlr-layer-shell), Catppuccin Mocha"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cairo-rs = "0.20"
pango = "0.20"
pangocairo = "0.20"
memmap2 = "0.9"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
