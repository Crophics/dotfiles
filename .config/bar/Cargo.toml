[package]
name = "bar"
version = "0.1.0"
edition = "2021"
description = "Hyprland bar (Catppuccin Mocha), replaces the quickshell bar"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cairo-rs = "0.20"
pango = "0.20"
pangocairo = "0.20"
memmap2 = "0.9"
libc = "0.2"
serde_json = "1"
dbus = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
