background {
    monitor =
    color = rgb(0, 0, 0)
}

general {
    hide_cursor = true
    grace = 2
}

# Lock icon
label {
    monitor =
    text = \uf023 
    color = rgba(255, 255, 255, 0.3)
    font_size = 24
    font_family = MesloLGS Nerd Font
    position = 0, 240
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME12
    color = rgb(255, 255, 255)
    font_size = 110
    font_family = MesloLGS Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "\uf073  $(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = MesloLGS Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# Divider — thin hairline
label {
    monitor =
    text = ────────────────────────
    color = rgba(255, 255, 255, 0.1)
    font_size = 12
    font_family = MesloLGS Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# User row
label {
    monitor =
    text = \uf007  $USER
    color = rgba(255, 255, 255, 0.75)
    font_size = 16
    font_family = MesloLGS Nerd Font
    position = 0, -75
    halign = center
    valign = center
}

# Password bubble — constant border, fail-state and caps feedback handled via labels
input-field {
    monitor =
    size = 300, 58
    rounding = 29
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgb(255, 255, 255)
    font_family = MesloLGS Nerd Font
    fade_on_empty = true
    placeholder_text = <i>  Enter Password</i>
    placeholder_text_color = rgba(255, 255, 255, 0.4)
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    hide_input = false

    fail_color = rgba(255, 255, 255, 0.35)
    fail_text = <i>Wrong password</i>
    fail_transition = 250

    capslock_color = rgba(255, 255, 255, 0.18)
    invert_numlock = false

    position = 0, -140
    halign = center
    valign = center
}

# Caps lock warning — only visible when caps lock is active
label {
    monitor =
    text = cmd[update:100] bash -c 'if grep -q 1 /sys/class/leds/*capslock*/brightness 2>/dev/null; then echo "CAPS LOCK ON"; fi'
    color = rgba(255, 255, 255, 0.5)
    font_size = 13
    font_family = MesloLGS Nerd Font
    position = 0, -200
    halign = center
    valign = center
}

# Status row — battery (with charging indicator) + wifi
label {
    monitor =
    text = cmd[update:5000] bash -c '\
        cap=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo "--"); \
        status=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); \
        if [ "$status" = "Charging" ]; then bolt="\uf0e7"; else bolt=""; fi; \
        ssid=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep "^yes" | cut -d: -f2); \
        echo "\uf240 ${cap}% ${bolt}   \uf1eb   ${ssid}"'
    color = rgba(255, 255, 255, 0.35)
    font_size = 14
    font_family = MesloLGS Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}