# hypridle: lock after 5 minutes idle, suspend after 15.
# Also locks before any suspend (lid close, manual), via loginctl.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = ~/.config/hypr/scripts/sleep-hook.sh before
    after_sleep_cmd = ~/.config/hypr/scripts/sleep-hook.sh after
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/suspend.sh
}
