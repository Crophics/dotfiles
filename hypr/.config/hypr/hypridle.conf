# hypridle: lock after 5 minutes idle, suspend after 15.
# Locks before any sleep (before_sleep_cmd), so every wake shows the lock screen.
general {
    lock_cmd = ~/.config/qylock/lock.sh
    before_sleep_cmd = ~/.config/hypr/scripts/sleep-screen.sh before
    after_sleep_cmd = ~/.config/hypr/scripts/sleep-screen.sh after
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/suspend.sh
}
