$lock_cmd = /home/ryoku/.local/share/quickshell-lockscreen/lock.sh
# $lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' # old ii built-in quickshell lockscreen
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # DPMS was previously only re-enabled by the 10min-idle listener's own
    # on-resume below, not on a real suspend/resume - a real suspend doesn't
    # necessarily go through that listener. This part is a genuine fix, not
    # a workaround.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 595 # 5s before screen off, as a warning
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600 # 10mins
    on-timeout = loginctl lock-session && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
