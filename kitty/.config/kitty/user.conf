# Personal kitty settings, loaded last by Ryoku's kitty.conf (globinclude user.conf),
# so they win over Ryoku's defaults. Colors stay with Ryoku (current-theme.conf,
# generated from the wallpaper).

# overrides the font picked in Ryoku Settings (current-font.conf)
font_family      MesloLGS Nerd Font
font_size        11
window_margin_width 21.75

